<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <style>
      .title { font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #172033; }
      .subtitle { font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 18px; fill: #566071; }
      .label { font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #172033; }
      .small { font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 14px; fill: #364152; }
      .tiny { font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 12px; fill: #4b5565; }
      .module { stroke: #172033; stroke-width: 2; rx: 8; ry: 8; }
      .dash { stroke-dasharray: 8 7; }
      .thin { stroke-width: 1.5; }
      .wire { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .wireThin { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .pin { fill: #fff; stroke: #172033; stroke-width: 1.5; }
      .screw { fill: #eef2f7; stroke: #667085; stroke-width: 2; }
      .noteBox { fill: #fffdf4; stroke: #d4a72c; stroke-width: 2; rx: 8; ry: 8; }
      .warning { fill: #fff1f2; stroke: #e11d48; stroke-width: 2; rx: 8; ry: 8; }
      .callout { fill: #f6f8fb; stroke: #98a2b3; stroke-width: 1.5; rx: 8; ry: 8; }
      .arrow { marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#344054" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e11d48" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1100" fill="#f4f7fb" />

  <text x="60" y="62" class="title">HTIT-WB32LA + IIM-42352 + LC76G + DS3231 一体化装配示意图</text>
  <text x="60" y="94" class="subtitle">目标：把当前飞线原型整理成可移动、抗震、可重复测试的 TX 节点。推荐使用塑料外壳 + FR4 洞洞板 + 螺柱 + 锁扣线束。</text>

  <!-- Main enclosure top view -->
  <rect x="60" y="130" width="1020" height="650" rx="24" ry="24" fill="#e9eef6" stroke="#344054" stroke-width="4" />
  <rect x="95" y="165" width="950" height="580" rx="16" ry="16" fill="#ffffff" stroke="#667085" stroke-width="2" class="dash" />
  <text x="90" y="155" class="label">顶视布局：ABS/PC 塑料外壳，建议 120 x 80 x 45 mm 起步</text>
  <text x="110" y="735" class="small">灰色外框：外壳；虚线：FR4 洞洞板/载板；所有模块用铜柱/尼龙柱固定，线束用扎带座做应力释放。</text>

  <!-- GPS area -->
  <rect x="130" y="195" width="300" height="150" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="12" ry="12" />
  <text x="150" y="225" class="label">LC76G GPS 区</text>
  <rect x="215" y="245" width="130" height="75" fill="#fefce8" stroke="#84cc16" stroke-width="2" rx="8" ry="8" />
  <rect x="238" y="258" width="84" height="49" fill="#fff7ed" stroke="#d97706" stroke-width="1.5" rx="6" ry="6" />
  <circle cx="280" cy="282" r="8" fill="#e2e8f0" stroke="#94a3b8" />
  <text x="247" y="340" class="small">陶瓷天线朝上</text>
  <path d="M285 240 C285 205 320 195 350 202" class="wireThin" stroke="#16a34a" />
  <text x="140" y="365" class="tiny">放在塑料上盖下方，远离电源模块和金属件</text>

  <!-- Power module -->
  <rect x="125" y="435" width="290" height="145" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="12" ry="12" />
  <text x="150" y="466" class="label">电源模块区</text>
  <rect x="178" y="495" width="180" height="55" fill="#111827" stroke="#374151" stroke-width="2" rx="8" ry="8" />
  <text x="205" y="529" font-family="Arial, sans-serif" font-size="17" fill="#f9fafb" font-weight="700">DC/DC + 3V3</text>
  <circle cx="140" cy="508" r="8" fill="#ef4444" />
  <circle cx="140" cy="540" r="8" fill="#111827" />
  <text x="150" y="512" class="tiny">3V3</text>
  <text x="150" y="544" class="tiny">GND</text>
  <path d="M80 505 L126 505" class="wire" stroke="#ef4444" />
  <path d="M80 540 L126 540" class="wire" stroke="#111827" />
  <text x="85" y="595" class="tiny">外部电源入口加开关/保险丝/应力释放</text>

  <!-- DS3231 -->
  <rect x="470" y="210" width="220" height="115" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" rx="12" ry="12" />
  <text x="493" y="242" class="label">DS3231</text>
  <rect x="520" y="262" width="118" height="34" fill="#7c3aed" opacity="0.16" stroke="#7c3aed" rx="5" ry="5" />
  <text x="505" y="318" class="tiny">SDA/SCL 到 HTIT-WB32LA</text>
  <text x="505" y="339" class="tiny">32K 短线到 IIM INT2/CLKIN</text>

  <!-- Main board -->
  <rect x="735" y="235" width="255" height="270" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="14" ry="14" />
  <text x="765" y="268" class="label">HTIT-WB32LA</text>
  <rect x="800" y="295" width="126" height="155" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="12" ry="12" />
  <rect x="825" y="330" width="76" height="52" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="5" ry="5" />
  <text x="842" y="362" font-family="Arial, sans-serif" font-size="13" fill="#67e8f9">OLED</text>
  <rect x="846" y="452" width="34" height="24" fill="#cbd5e1" stroke="#64748b" rx="4" ry="4" />
  <text x="756" y="494" class="tiny">USB 口朝外壳开窗，方便烧录/调试</text>
  <circle cx="747" cy="247" r="9" class="screw" />
  <circle cx="978" cy="247" r="9" class="screw" />
  <circle cx="747" cy="493" r="9" class="screw" />
  <circle cx="978" cy="493" r="9" class="screw" />

  <!-- IIM rigid mount -->
  <rect x="505" y="540" width="260" height="145" fill="#fff7ed" stroke="#f97316" stroke-width="2" rx="12" ry="12" />
  <text x="530" y="574" class="label">IIM-42352 测振区</text>
  <rect x="565" y="602" width="130" height="48" fill="#431407" opacity="0.1" stroke="#f97316" stroke-width="2" rx="6" ry="6" />
  <text x="585" y="633" class="small">IIM-42352</text>
  <circle cx="535" cy="605" r="9" class="screw" />
  <circle cx="735" cy="605" r="9" class="screw" />
  <circle cx="535" cy="664" r="9" class="screw" />
  <circle cx="735" cy="664" r="9" class="screw" />
  <text x="520" y="707" class="tiny">必须刚性固定到底板/被测物；不要用泡棉或软胶</text>

  <!-- LoRa SMA/antenna -->
  <rect x="930" y="555" width="115" height="70" fill="#f8fafc" stroke="#475467" stroke-width="2" rx="10" ry="10" />
  <text x="950" y="597" class="label">SMA</text>
  <path d="M990 590 L1115 590" class="wire" stroke="#111827" />
  <rect x="1115" y="565" width="38" height="50" fill="#cbd5e1" stroke="#475467" stroke-width="2" rx="6" ry="6" />
  <path d="M1153 590 L1230 500" class="wire" stroke="#111827" />
  <path d="M1230 500 L1268 454" class="wire" stroke="#111827" />
  <text x="1110" y="650" class="small">LoRa 天线外置，避免被外壳/线束遮挡</text>

  <!-- Cable glands / ports -->
  <rect x="48" y="485" width="35" height="80" fill="#cbd5e1" stroke="#475467" stroke-width="2" rx="8" ry="8" />
  <text x="60" y="620" class="tiny">电源入口</text>
  <rect x="1015" y="330" width="42" height="92" fill="#cbd5e1" stroke="#475467" stroke-width="2" rx="8" ry="8" />
  <text x="1000" y="444" class="tiny">USB 开窗</text>

  <!-- Wire harnesses -->
  <path d="M415 510 C475 515 520 512 585 600" class="wire" stroke="#ef4444" opacity="0.85" />
  <path d="M415 540 C475 545 520 545 585 650" class="wire" stroke="#111827" opacity="0.85" />
  <path d="M690 274 C735 285 740 305 780 330" class="wireThin" stroke="#22c55e" />
  <path d="M690 294 C735 315 745 335 780 360" class="wireThin" stroke="#22c55e" />
  <path d="M615 325 C613 430 610 505 610 600" class="wireThin" stroke="#7c3aed" />
  <path d="M430 280 C535 375 642 400 800 418" class="wireThin" stroke="#0ea5e9" />
  <path d="M430 305 C540 390 660 430 800 442" class="wireThin" stroke="#0ea5e9" />
  <path d="M430 330 C540 410 675 450 800 462" class="wireThin" stroke="#0ea5e9" />
  <path d="M735 410 C670 470 640 535 635 600" class="wireThin" stroke="#f97316" />
  <path d="M735 430 C680 485 660 545 660 600" class="wireThin" stroke="#f97316" />
  <path d="M735 450 C695 500 680 555 685 600" class="wireThin" stroke="#f97316" />

  <!-- Legend -->
  <rect x="1135" y="150" width="395" height="270" class="callout" />
  <text x="1160" y="185" class="label">线束颜色建议</text>
  <line x1="1160" y1="215" x2="1230" y2="215" class="wire" stroke="#ef4444" />
  <text x="1245" y="221" class="small">3V3 电源</text>
  <line x1="1160" y1="250" x2="1230" y2="250" class="wire" stroke="#111827" />
  <text x="1245" y="256" class="small">GND 共地</text>
  <line x1="1160" y1="285" x2="1230" y2="285" class="wireThin" stroke="#f97316" />
  <text x="1245" y="291" class="small">IIM SPI / INT1</text>
  <line x1="1160" y1="320" x2="1230" y2="320" class="wireThin" stroke="#22c55e" />
  <text x="1245" y="326" class="small">DS3231 I2C</text>
  <line x1="1160" y1="355" x2="1230" y2="355" class="wireThin" stroke="#7c3aed" />
  <text x="1245" y="361" class="small">DS3231 32K 到 IIM</text>
  <line x1="1160" y1="390" x2="1230" y2="390" class="wireThin" stroke="#0ea5e9" />
  <text x="1245" y="396" class="small">GPS UART / PPS</text>

  <!-- Pin table -->
  <rect x="1135" y="445" width="395" height="305" class="callout" />
  <text x="1160" y="480" class="label">主要连接表</text>
  <text x="1160" y="515" class="small">IIM SCK  -> GPIO47</text>
  <text x="1160" y="540" class="small">IIM MOSI -> GPIO48</text>
  <text x="1160" y="565" class="small">IIM MISO -> GPIO33</text>
  <text x="1160" y="590" class="small">IIM CSB  -> GPIO34</text>
  <text x="1160" y="615" class="small">IIM INT1 -> GPIO26</text>
  <text x="1160" y="640" class="small">IIM INT2/CLKIN <- DS3231 32K</text>
  <text x="1160" y="675" class="small">LC76G TX/RX/PPS -> GPIO5/6/4</text>
  <text x="1160" y="700" class="small">DS3231 SDA/SCL -> GPIO41/42</text>
  <text x="1160" y="725" class="small">所有模块 3V3/GND 共用同一电源地</text>

  <!-- Warnings -->
  <rect x="1135" y="780" width="395" height="185" class="warning" />
  <text x="1160" y="815" class="label">装配重点</text>
  <text x="1160" y="850" class="small">1. IIM-42352 要刚性固定，不要软连接。</text>
  <text x="1160" y="880" class="small">2. GPS 天线朝上，外壳不要用金属盒。</text>
  <text x="1160" y="910" class="small">3. LoRa 天线尽量外置，使用 SMA 穿板座。</text>
  <text x="1160" y="940" class="small">4. 电源线比信号线粗，入口要做拉力保护。</text>

  <!-- Side view -->
  <rect x="60" y="830" width="1020" height="210" class="noteBox" />
  <text x="90" y="865" class="label">侧视结构建议</text>
  <line x1="130" y1="910" x2="990" y2="910" stroke="#475467" stroke-width="4" />
  <text x="135" y="895" class="small">塑料上盖</text>
  <rect x="235" y="875" width="140" height="30" fill="#dcfce7" stroke="#16a34a" rx="5" ry="5" />
  <text x="265" y="895" class="tiny">GPS 朝上</text>
  <rect x="450" y="935" width="360" height="38" fill="#ffffff" stroke="#667085" stroke-width="2" rx="6" ry="6" />
  <text x="548" y="959" class="small">FR4 洞洞板 + 主控/时钟/电源</text>
  <line x1="170" y1="990" x2="1010" y2="990" stroke="#344054" stroke-width="6" />
  <text x="135" y="1025" class="small">外壳底板</text>
  <rect x="515" y="1000" width="215" height="28" fill="#fff7ed" stroke="#f97316" stroke-width="2" rx="5" ry="5" />
  <text x="552" y="1019" class="tiny">IIM 刚性测振安装面</text>
  <line x1="515" y1="1037" x2="730" y2="1037" stroke="#f97316" stroke-width="5" />
  <text x="765" y="1041" class="small">固定到被测物或小铝底板</text>
</svg>
