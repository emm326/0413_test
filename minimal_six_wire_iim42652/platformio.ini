[platformio]
default_envs = eora_s3_400_iim42652_six_wire
src_dir = src

[env:eora_s3_400_iim42652_six_wire]
platform = espressif32 @ 6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 460800
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:eora_s3_400_iim42652_six_wire_alt_cs]
extends = env:eora_s3_400_iim42652_six_wire
build_flags = ${env:eora_s3_400_iim42652_six_wire.build_flags}
  -DSIX_WIRE_CS_PIN=35
