; PlatformIO Project Configuration File
;
; Default build targets the P2P GPS/PPS synchronized IIM-42352 plan.

[platformio]
default_envs = heltec_wifi_lora_32_V3_rx
  heltec_wifi_lora_32_V3_iim_gps_tx_1001
  heltec_wifi_lora_32_V3_iim_gps_tx_1002

[common]
monitor_speed = 460800
lib_deps =
  jgromes/RadioLib @ 7.6.0
  adafruit/Adafruit GFX Library @ ^1.12.1
  adafruit/Adafruit SSD1306 @ ^2.5.13
common_build_flags =
  -D APP_TX_STARTUP_JITTER_MAX_MS=0
  -D APP_TX_PACKET_JITTER_MAX_MS=0
p2p_common_build_flags =
  ${common.common_build_flags}
  -D APP_P2P_NODE_COUNT_VALUE=2
  -D APP_MAX_SAMPLES_PER_PACKET_VALUE=24
  -D APP_TX_QUEUE_PACKET_CAPACITY_VALUE=256
  -D APP_P2P_BURST_PACKETS_PER_NODE_VALUE=6
  -D APP_P2P_START_ALIGN_GPS_SECOND=1
p2p_tx_build_flags =
  ${common.p2p_common_build_flags}
  -D ROLE_TX
  -D APP_LORA_FREQUENCY_MHZ_VALUE=470.0f
iim_gps_tx_build_flags =
  ${common.p2p_tx_build_flags}
  -D APP_SENSOR_IIM42352
  -D APP_REQUIRE_GPS_TIMEBASE
  -D APP_USE_DS3231_32K_TIMESTAMPS
  -D APP_IIM42352_INT1_INPUT_PULLUP_VALUE=1
  -D APP_IIM42352_INT1_INTERRUPT_MODE_FALLING=1
tx_usb_test_build_flags =
  ${common.common_build_flags}
  -D ROLE_TX
  -D APP_SENSOR_IIM42352
  -D APP_TX_USB_STREAM_TEST
  -D APP_USE_DS3231_32K_TIMESTAMPS
  -D APP_MAX_SAMPLES_PER_PACKET_VALUE=24
  -D APP_TX_QUEUE_PACKET_CAPACITY_VALUE=16
  -D APP_IIM42352_INT1_INPUT_PULLUP_VALUE=1
  -D APP_IIM42352_INT1_INTERRUPT_MODE_FALLING=1
tx_usb_gps_sync_test_build_flags =
  ${common.tx_usb_test_build_flags}
  -D APP_TX_USB_GPS_SYNC_TEST
  -D APP_REQUIRE_GPS_TIMEBASE

[env:heltec_wifi_lora_32_V3_rx]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = ${common.monitor_speed}
lib_deps =
  ${common.lib_deps}
build_flags =
  ${common.p2p_common_build_flags}
  -D APP_USE_DS3231_32K_TIMESTAMPS
  -D ROLE_RX
upload_port = COM6
monitor_port = COM6

[env:heltec_wifi_lora_32_V3_tx]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = ${common.monitor_speed}
lib_deps =
  ${common.lib_deps}
build_flags =
  ${common.p2p_tx_build_flags}
  -D APP_DEVICE_ID_VALUE=1001
; upload_port = COM7
; monitor_port = COM7

