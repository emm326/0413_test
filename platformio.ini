[platformio]
default_envs = heltec_v32_iim42352_tx
src_dir = firmware
include_dir = firmware

[env]
platform = espressif32 @ 6.12.0
framework = arduino
monitor_speed = 460800
lib_deps =
  jgromes/RadioLib @ 7.6.0
build_flags =
  -Ifirmware/common
  -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*>

[heltec]
board = heltec_wifi_lora_32_V3
build_flags =
  ${env.build_flags}
  -D APP_BOARD_HELTEC=1
  -D APP_UPLINK_MHZ=470.5f

[eora]
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi
build_flags =
  ${env.build_flags}
  -D APP_BOARD_EORA=1
  -D BOARD_HAS_PSRAM
  -D APP_UPLINK_MHZ=470.3f

[env:heltec_v32_iim42352_tx]
board = ${heltec.board}
build_flags = ${heltec.build_flags}
  -D APP_SENSOR_IIM42352=1
  -D APP_DEVICE_ID_VALUE=1002
build_src_filter = +<main.cpp> +<common/> +<boards/heltec_v32/> +<sensors/iim42352/>

[env:heltec_v32_iim42652_tx]
board = ${heltec.board}
build_flags = ${heltec.build_flags}
  -D APP_SENSOR_IIM42652=1
  -D APP_DEVICE_ID_VALUE=1004
build_src_filter = +<main.cpp> +<common/> +<boards/heltec_v32/> +<sensors/iim42652/>

[env:eora_s3_400_iim42352_tx]
board = ${eora.board}
board_build.flash_size = ${eora.board_build.flash_size}
board_upload.flash_size = ${eora.board_upload.flash_size}
board_build.partitions = ${eora.board_build.partitions}
board_build.arduino.memory_type = ${eora.board_build.arduino.memory_type}
build_flags = ${eora.build_flags}
  -D APP_SENSOR_IIM42352=1
  -D APP_DEVICE_ID_VALUE=1001
build_src_filter = +<main.cpp> +<common/> +<boards/eora_s3_400/> +<sensors/iim42352/>

[env:eora_s3_400_iim42652_tx]
board = ${eora.board}
board_build.flash_size = ${eora.board_build.flash_size}
board_upload.flash_size = ${eora.board_upload.flash_size}
board_build.partitions = ${eora.board_build.partitions}
board_build.arduino.memory_type = ${eora.board_build.arduino.memory_type}
build_flags = ${eora.build_flags}
  -D APP_SENSOR_IIM42652=1
  -D APP_DEVICE_ID_VALUE=1003
build_src_filter = +<main.cpp> +<common/> +<boards/eora_s3_400/> +<sensors/iim42652/>

[env:heltec_v32_iim42352_usb_test]
extends = env:heltec_v32_iim42352_tx
build_flags = ${env:heltec_v32_iim42352_tx.build_flags}
  -D APP_USB_TEST=1

[env:heltec_v32_iim42652_usb_test]
extends = env:heltec_v32_iim42652_tx
build_flags = ${env:heltec_v32_iim42652_tx.build_flags}
  -D APP_USB_TEST=1

[env:eora_s3_400_iim42352_usb_test]
extends = env:eora_s3_400_iim42352_tx
build_flags = ${env:eora_s3_400_iim42352_tx.build_flags}
  -D APP_USB_TEST=1

[env:eora_s3_400_iim42652_usb_test]
extends = env:eora_s3_400_iim42652_tx
build_flags = ${env:eora_s3_400_iim42652_tx.build_flags}
  -D APP_USB_TEST=1
