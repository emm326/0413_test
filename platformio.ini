; PlatformIO Project Configuration File
;
; Default build now targets the LoRaWAN ABP transmitter for the
; Ebyte E870-L470LG11 / CN470 gateway migration. The original P2P
; TX/RX environments are kept for fallback testing.

[platformio]
default_envs = heltec_wifi_lora_32_V3_lorawan_tx_1001

[common]
monitor_speed = 115200
lib_deps =
  jgromes/RadioLib @ 7.6.0
  adafruit/Adafruit GFX Library @ ^1.12.1
  adafruit/Adafruit SSD1306 @ ^2.5.13
common_build_flags =
  -D APP_TX_STARTUP_JITTER_MAX_MS=0
  -D APP_TX_PACKET_JITTER_MAX_MS=0
p2p_tx_build_flags =
  ${common.common_build_flags}
  -D ROLE_TX
  -D APP_LORA_FREQUENCY_MHZ_VALUE=470.0f
lorawan_build_flags =
  -D APP_LORAWAN_TX
  -D APP_MAX_SAMPLES_PER_PACKET_VALUE=37
  -D APP_LORAWAN_SUB_BAND_VALUE=1
  -D APP_LORAWAN_DATARATE_VALUE=5
  -D APP_LORAWAN_FPORT_VALUE=10
  -D APP_LORAWAN_CONFIRMED_UPLINK_VALUE=0
  -D APP_LORAWAN_ADR_ENABLED_VALUE=0
  -D APP_LORAWAN_DUTY_CYCLE_ENABLED_VALUE=0

[env:heltec_wifi_lora_32_V3_rx]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = ${common.monitor_speed}
lib_deps =
  ${common.lib_deps}
build_flags =
  ${common.common_build_flags}
  -D ROLE_RX
upload_port = COM6
monitor_port = COM6

[env:heltec_wifi_lora_32_V3_tx]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = ${common.monitor_speed}
lib_deps =
  ${common.lib_deps}
build_flags =
  ${common.p2p_tx_build_flags}
  -D APP_DEVICE_ID_VALUE=1001
; upload_port = COM7
; monitor_port = COM7

